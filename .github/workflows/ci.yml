name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The webkit and GTK development packages used to be installed with a raw
      # `apt-get install`, and that was the whole cost of this job: on
      # ubuntu-latest it took 24 minutes of a 26 minute run, before a single
      # line of Rust was compiled. The compiled part was cheap because the
      # cargo cache was already warm.
      #
      # The downloaded packages are cached, so apt installs from the local
      # copy instead of fetching them from the mirror every time. The runner
      # image only runs `apt-get clean` when the image is built, so the files
      # are still in the archives directory for the length of the job.
      #
      # The key carries a version. Bump it when the package list below
      # changes: apt would otherwise install what is cached and ignore the
      # new packages.
      #
      # Only the .deb files are cached. The archives directory also holds apt's
      # own lock file and its `partial` directory, and restoring a stale lock
      # is a way to have apt refuse to run at all.
      - name: Cache the apt package downloads
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-webkit-gtk-v1
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # The embedding tests need the real model, which is not committed. They
      # skip themselves when it is absent, and a skipped test is a hole in the
      # coverage, so the model is fetched before the tests run. The fetch is
      # pinned to a revision and a checksum, so it is the same model the
      # developers test against.
      - name: Fetch the embedding model
        run: bash scripts/download-model.sh
      - name: test
        run: cargo test --workspace
      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            extension/package-lock.json
      - run: npm --prefix ui ci || npm --prefix ui install
      - run: npm --prefix ui run build
      - run: npm --prefix extension ci || npm --prefix extension install
      - run: npm --prefix extension run build

  # The end-to-end test drives a real browser against a real core, so it needs
  # both toolchains. It is the only job that proves the UI can actually reach
  # the API -- the js job builds the frontend and never runs it.
  e2e:
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci || npm --prefix ui install
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      # The scored-snippets endpoint uses the embedding model, so the browser
      # test runs against the same scores a developer sees rather than the
      # neutral S1 of a machine without the model.
      - name: Fetch the embedding model
        run: bash scripts/download-model.sh
      # Pre-build so Playwright's webServer timeout measures the test, not a
      # cold compile.
      - name: Build the CLI the E2E server runs
        run: cargo build -p kfx-cli
      - run: npm --prefix ui run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/test-results
            ui/playwright-report
          retention-days: 7