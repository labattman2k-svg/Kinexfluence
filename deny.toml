# cargo-deny configuration (https://github.com/EmbarkStudios/cargo-deny)
# Documented allowlist file per docs/STANDARDS.md §10
#
# Config format targets cargo-deny 0.20 (the version in local dev and CI).
# Note for reviewers: `vulnerability`, `unsound`, `yanked`, `notice`,
# `unlicensed` and `allow-osi-fsf-free` were REMOVED upstream. Vulnerabilities
# and unsound advisories are always denied; yanked/notice are always warnings;
# unlicensed crates are always denied. Removing those keys does not weaken the
# gate. `unmaintained` now selects a scope, not a severity. `[licenses]
# version = 2` is REQUIRED in 0.20 — without it the `allow` list below is
# silently inert and the license gate fails on every crate.

[advisories]
# Scope of unmaintained-advisory reporting: all | workspace | transitive | none.
# "workspace" reports unmaintained crates this project controls without failing
# CI on unmaintained transitive deps we cannot patch. This is the closest
# equivalent to the pre-0.20 "unmaintained = warn" intent, which reported but
# did not block. Setting it to "none" would disable the check outright.
unmaintained = "workspace"
ignore = [
    # Exceptions to any advisory gate are recorded in docs/STANDARDS_EXCEPTIONS.md
    # with a date, a reason, and a linked issue. Nothing is ignored inline.
]

[licenses]
version = 2
allow = [
    # This project's own licence. It is here because cargo-deny checks the
    # licence of the workspace crates too: they are path dependencies of each
    # other, so they appear in the graph cargo-deny walks.
    "LicenseRef-Proprietary",
    # AGPL-3.0-or-later used to be in this list because the workspace crates
    # themselves were AGPL. They no longer are, and no third-party dependency
    # in the graph was AGPL, so it has been removed: an AGPL dependency is
    # now refused rather than tolerated.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
