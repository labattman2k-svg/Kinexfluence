[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/adapters",
  "crates/cli",
  "crates/tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Proprietary, not open source. See LICENSE. `LicenseRef-Proprietary` is the
# SPDX form for a licence that is not on the SPDX list; crates.io rejects
# crates whose licence is not a listed SPDX identifier, which is the correct
# outcome for this project.
license = "LicenseRef-Proprietary"
authors = ["Kinexfluence"]
rust-version = "1.78"
# Every crate in this workspace also sets `publish = false` in its own
# manifest, and it must stay that way. The source is proprietary and must
# never reach a public registry. The setting is repeated per crate rather
# than inherited from here because `publish` only became an inheritable
# workspace key in a Cargo release newer than the `rust-version` above, and
# an inherited key that old a toolchain cannot parse would be a broken
# build rather than a safe default.

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.5"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
# Already present transitively via sqlx and tauri; declared directly because
# kfx-core now hashes snippet and conversation content.
sha2 = "0.10"
