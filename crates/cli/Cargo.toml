[package]
name = "kfx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# The source is proprietary. See LICENSE. This is the safeguard that
# keeps it off crates.io, and it must not be removed.
publish = false

[[bin]]
name = "kinexfluence"
path = "src/main.rs"

[dependencies]
kfx-core = { path = "../core" }
kfx-adapters = { path = "../adapters" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
# Test-only. The binary itself never names a sqlx type: it goes through
# `kfx_core::storage` and `kfx_core::writer`, which are what own those. The
# CLI tests use it to read back what the import actually wrote, because
# asserting on stdout alone could not tell "wrote the rows" from "printed a
# summary".
sqlx.workspace = true
